{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
              {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
          {%- comment -%}
            An <a> rather than a <button>: the greedy-nav script claims every
            <button> inside .greedy-nav as its overflow hamburger and hides it.
          {%- endcomment -%}
          <li class="masthead__menu-item">
            <a class="theme-toggle" role="button" tabindex="0" aria-label="Toggle light and dark colour scheme" title="Toggle light and dark colour scheme"><i class="fas fa-moon theme-toggle__light" aria-hidden="true"></i><i class="fas fa-sun theme-toggle__dark" aria-hidden="true"></i></a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
